services:
  printer:
    build: .
    working_dir: /app
    volumes:
      - ./src:/app/src
      - ./tests:/app/tests
      - ./config:/config
      - ../crewday:/crewday:ro
    environment:
      PYTHONPATH: /app/src
      PRINTER_CONFIG: /config/printer.yaml
      PRINTER_UI_USERNAME: admin
      PRINTER_UI_PASSWORD: admin
      PRINTER_CONFIG_SECRET_KEY: local-dev-printer-config-secret-key
      # Process-local timezone for container code that asks the OS for local time.
      # Receipt task times come from timezone in /config/printer.yaml.
      TZ: ${TZ:-Asia/Dubai}
      PRINTER_HOST: ${PRINTER_HOST:-192.168.20.15}
      CREWDAY_API_TOKEN: ${CREWDAY_API_TOKEN:-}
    ports:
      - "8087:8080"
    # Uncomment for USB printer access:
    # devices:
    #   - /dev/bus/usb:/dev/bus/usb
    # Uncomment for CUPS printer access (requires CUPS on host):
    # volumes:
    #   - /var/run/cups/cups.sock:/var/run/cups/cups.sock

  dev:
    build: .
    working_dir: /app
    volumes:
      - ./src:/app/src
      - ./tests:/app/tests
      - ./config:/config
      - ../crewday:/crewday:ro
    environment:
      PYTHONPATH: /app/src
      PRINTER_CONFIG: /config/printer.yaml
      PRINTER_UI_USERNAME: admin
      PRINTER_UI_PASSWORD: admin
      PRINTER_CONFIG_SECRET_KEY: local-dev-printer-config-secret-key
      # Process-local timezone for container code that asks the OS for local time.
      # Receipt task times come from timezone in /config/printer.yaml.
      TZ: ${TZ:-Asia/Dubai}
      PRINTER_HOST: ${PRINTER_HOST:-192.168.20.15}
      CREWDAY_API_TOKEN: ${CREWDAY_API_TOKEN:-}
    ports:
      - "8087:8080"
    # Uncomment for USB printer access:
    # devices:
    #   - /dev/bus/usb:/dev/bus/usb
    # Uncomment for CUPS printer access (requires CUPS on host):
    # volumes:
    #   - /var/run/cups/cups.sock:/var/run/cups/cups.sock
    command: ["uv", "run", "--group", "dev", "watchfiles", "uv run python -m printer_app serve --host 0.0.0.0 --port 8080", "/app/src", "/config"]
