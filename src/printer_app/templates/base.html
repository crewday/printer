<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% block title %}crew.day · printer console{% endblock %}</title>
    <meta name="theme-color" content="#FAF7F2">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,600;9..144,700&family=Inter+Tight:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap">

    <link rel="stylesheet" href="/static/ui.css">
    <script>
      (function () {
        try {
          var stored = localStorage.getItem("printer-theme");
          if (stored === "light" || stored === "dark") {
            document.documentElement.setAttribute("data-theme", stored);
          }
        } catch (e) { /* private mode — ignore */ }
      })();
    </script>
  </head>
  <body>
    <div class="aura" aria-hidden="true"></div>
    <div class="grain" aria-hidden="true"></div>

    <main class="shell">
      <header class="page-topbar">
        <div class="page-topbar__heading">
          {% block topbar_heading %}
            <h1 class="page-title">Printer <em>console</em></h1>
          {% endblock %}
        </div>
        <div class="page-topbar__trailing">
          <button
            type="button"
            class="icon-btn"
            id="theme-toggle"
            aria-label="Toggle light/dark theme"
            title="Toggle theme">
            <svg class="icon-btn__sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <circle cx="12" cy="12" r="4"></circle>
              <path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M4.93 19.07l1.41-1.41M17.66 6.34l1.41-1.41"></path>
            </svg>
            <svg class="icon-btn__moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <path d="M21 12.79A9 9 0 1 1 11.21 3a7 7 0 0 0 9.79 9.79z"></path>
            </svg>
          </button>
        </div>
      </header>

      {% block content %}{% endblock %}

      <footer class="colophon">
        <span><strong>crew.day</strong> printer</span>
      </footer>
    </main>

    <script>
      (function () {
        var btn = document.getElementById("theme-toggle");
        if (!btn) return;
        btn.addEventListener("click", function () {
          var current = document.documentElement.getAttribute("data-theme");
          var next = current === "dark" ? "light" : "dark";
          document.documentElement.setAttribute("data-theme", next);
          try { localStorage.setItem("printer-theme", next); } catch (e) {}
        });
      })();
    </script>
    {% block extra_scripts %}{% endblock %}
  </body>
</html>
