ui:
  username: admin
  password_hash: null
crewday:
  source: mock
  base_url: http://crewday:8000
  api_token: null
  workspace_id: null
print_schedule:
  cron: ''
receipt_template:
  sections:
  - type: logo
    value: null
    align: center
    font: a
    width: 1
    height: 1
    bold: false
    underline: 0
    scale: 1.0
    trailing_blank: true
  - type: text
    value: '{{ worker_name }}, {{ display_date }}'
    align: center
    font: b
    width: 2
    height: 2
    bold: true
    underline: 0
    scale: 1.0
    trailing_blank: true
  - type: text
    value: Printed on {{ display_datetime }}
    align: center
    font: b
    width: 1
    height: 1
    bold: false
    underline: 0
    scale: 1.0
    trailing_blank: true
  - type: separator
    value: null
    align: center
    font: a
    width: 1
    height: 1
    bold: false
    underline: 0
    scale: 1.0
    trailing_blank: true
  - type: tasks
    value: null
    align: left
    font: a
    width: 1
    height: 1
    bold: false
    underline: 0
    scale: 1.0
    trailing_blank: true
  - type: separator
    value: null
    align: center
    font: a
    width: 1
    height: 1
    bold: false
    underline: 0
    scale: 1.0
    trailing_blank: false
  - type: logo
    value: null
    align: center
    font: a
    width: 1
    height: 1
    bold: false
    underline: 0
    scale: 0.5
    trailing_blank: true
printer:
  type: network_escpos
  profile: epson_tm_t20ii
  host: 192.168.20.15
  port: 9100
  timeout_seconds: 5.0
  paper_columns: 48
  code_page: cp1252
  image_logo: true
  supports_print_density: true
  supports_print_speed: true
  print_density: 8
  print_speed: 6
  cut: true
workers:
- name: Vincent
  schedule: ''
  crewday_user_id: null
  timezone: Asia/Dubai
  tasks:
  - Review overnight crewday updates
  - Print the next task batch
  - Confirm thermal printer output is readable
