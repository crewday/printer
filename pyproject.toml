[project]
name = "crewday-printer"
version = "0.1.0"
description = "Docker-hosted worker task list printer for Crewday."
requires-python = ">=3.14"
dependencies = [
  "cairosvg>=2.7.1",
  "cryptography>=42.0.0",
  "fastapi>=0.115.12",
  "httpx>=0.28.1",
  "jinja2>=3.1.6",
  "pillow>=11.2.1",
  "python-multipart>=0.0.20",
  "pyusb>=1.3.1",
  "pyyaml>=6.0.2",
  "uvicorn[standard]>=0.34.2",
]

[dependency-groups]
dev = [
  "pytest>=8.3.5",
  "ruff>=0.11.7",
  "watchfiles>=1.0.5",
]

[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
printer_app = [
  "assets/*.svg",
  "profiles/*.yaml",
  "templates/*.html",
  "static/*.css",
  "static/*.js",
  "static/*.svg",
]

[tool.ruff]
line-length = 88
target-version = "py314"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
