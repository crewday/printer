[project]
name = "crewday-printer"
version = "0.1.0"
description = "Docker-hosted worker task list printer for Crewday."
requires-python = ">=3.14"
dependencies = [
  "pyyaml>=6.0.2",
]

[project.optional-dependencies]
dev = [
  "watchfiles>=1.0.5",
]

[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

